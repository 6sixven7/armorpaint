name: Windows (Direct3D12)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile Release x64
        working-directory: paint
        shell: pwsh
        run: |
          & ..\base\make.bat --compile
          if ($LASTEXITCODE -ne 0) { throw "ArmorPaint compilation failed." }

      - name: Check portable application
        shell: pwsh
        run: |
          $out = 'paint/build/out'
          if (!(Test-Path "$out/ArmorPaint.exe")) {
            $exe = 'paint/build/x64/Release/ArmorPaint.exe'
            if (!(Test-Path $exe)) { throw 'Compiled ArmorPaint.exe was not found.' }
            Copy-Item $exe "$out/ArmorPaint.exe"
          }
          if (!(Test-Path "$out/data")) { throw 'Runtime data directory was not found.' }
          if (!(Get-ChildItem "$out/data" -Recurse -File | Select-Object -First 1)) {
            throw 'Runtime data directory is empty.'
          }
          Copy-Item 'license.md' "$out/SOURCE-LICENSE.md"
          Get-ChildItem $out

      - name: Downloadable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: paint/build/out/
          if-no-files-found: error
          retention-days: 30
